version: '3.8'

services:
  qa-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aurora-qa-system
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LOG_LEVEL=INFO
      - PORT=8000
      - SENTENCE_TRANSFORMERS_HOME=/app/data/models
      - TRANSFORMERS_CACHE=/app/data/models
      - HF_HOME=/app/data/models
      - TORCH_HOME=/app/data/models
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aurora-network

networks:
  aurora-network:
    driver: bridge
