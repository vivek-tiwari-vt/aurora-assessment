services:
  - type: web
    name: aurora-qa-system
    runtime: docker
    plan: free
    numInstances: 1
    
    # Build configuration
    dockerfilePath: ./docker/Dockerfile
    
    # Environment
    envVars:
      - key: LOG_LEVEL
        value: INFO
      
      # Add your OpenRouter API key here
      - key: OPENROUTER_API_KEY
        scope: RUN
        sync: false
    
    # Health check
    healthCheckPath: /api
    healthCheckInterval: 30
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Scaling
    maxInstanceCount: 1
    minInstanceCount: 1

# Crons (optional - for scheduled tasks)
# crons:
#   - id: data-refresh
#     schedule: "0 0 * * *"  # Daily at midnight
#     command: "curl https://aurora-qa-system.onrender.com/api/health"