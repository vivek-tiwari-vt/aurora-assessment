<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Q&A - Member Intelligence System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 500;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9ff;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .bot .avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0ff;
            border-radius: 4px 16px 16px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .confidence-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .source-item {
            background: rgba(0, 0, 0, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .source-item strong {
            display: block;
            color: #667eea;
            margin-bottom: 3px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0ff;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            border: 2px solid #e0e0ff;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 11px;
            color: #999;
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #f5576c;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            color: #d32f2f;
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .welcome-message h2 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .welcome-message p {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .example-questions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 20px;
        }

        .example-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 8px;
        }

        .example-btn:hover {
            background: #f0f0ff;
        }

        @media (max-width: 600px) {
            .container {
                border-radius: 0;
                max-height: 100vh;
                height: 100vh;
            }

            .header {
                border-radius: 0;
            }

            .message-content {
                max-width: 90%;
            }

            .header h1 {
                font-size: 20px;
            }

            .example-questions {
                grid-template-columns: 1fr;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Aurora Q&A System</h1>
            <p>Intelligent member data insights powered by AI</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>Welcome to Aurora</h2>
                <p>Ask me anything about member activities, travel plans, preferences, and more.</p>
                <div class="example-questions" id="exampleQuestions">
                    <button class="example-btn" onclick="askQuestion('When is Layla planning her trip to London?')">
                        When is Layla planning her trip to London?
                    </button>
                    <button class="example-btn" onclick="askQuestion('How many cars does Vikram Desai have?')">
                        How many cars does Vikram Desai have?
                    </button>
                    <button class="example-btn" onclick="askQuestion('What are Amira\'s favorite restaurants?')">
                        What are Amira's favorite restaurants?
                    </button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask something about the members..."
                    onkeypress="handleKeyPress(event)"
                >
            </div>
            <button id="sendBtn" onclick="askQuestion()">
                <span>Send</span>
                <span>→</span>
            </button>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script>
        let isLoading = false;
        const API_BASE = '/api';

        async function askQuestion(text) {
            const input = document.getElementById('questionInput');
            const question = text || input.value.trim();

            if (!question || isLoading) return;

            // Add user message
            addMessage('user', question);
            input.value = '';

            // Remove welcome message
            const welcome = document.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="avatar">✨</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            document.getElementById('chatContainer').appendChild(typingDiv);
            scrollToBottom();

            try {
                const response = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });

                // Remove typing indicator
                typingDiv.remove();

                if (!response.ok) {
                    const error = await response.json();
                    addMessage('bot', `Error: ${error.detail || 'Failed to get answer'}`);
                } else {
                    const data = await response.json();
                    
                    let messageHTML = `<div>${data.answer}</div>`;
                    
                    if (data.confidence) {
                        const confidencePercent = Math.round(data.confidence * 100);
                        messageHTML += `<div class="confidence-badge">Confidence: ${confidencePercent}%</div>`;
                    }

                    if (data.sources && data.sources.length > 0) {
                        messageHTML += '<div class="sources"><strong style="font-size: 12px; color: #667eea; margin-bottom: 8px;">📚 Sources:</strong>';
                        data.sources.forEach(source => {
                            const member = source.member_name || source.user_name || source.name || 'Unknown';
                            const content = source.message || source.content || source.text || '';
                            const preview = content ? content.substring(0, 100) + (content.length > 100 ? '...' : '') : 'No content available';
                            messageHTML += `<div class="source-item"><strong>${member}</strong><br>${preview}</div>`;
                        });
                        messageHTML += '</div>';
                    }

                    addMessage('bot', messageHTML, true);
                }
            } catch (error) {
                typingDiv.remove();
                addMessage('bot', `Connection error: ${error.message}`);
            } finally {
                isLoading = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('questionInput').focus();
            }
        }

        function addMessage(sender, content, isHTML = false) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = sender === 'user' ? '👤' : '✨';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isHTML) {
                contentDiv.innerHTML = content;
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.innerHTML = `<div class="avatar">${avatar}</div>`;
            messageDiv.appendChild(contentDiv);

            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey && !isLoading) {
                event.preventDefault();
                askQuestion();
            }
        }

        // Initialize
        async function init() {
            try {
                const response = await fetch(`${API_BASE}/health`, { method: 'POST' });
                if (response.ok) {
                    document.getElementById('status').textContent = '🟢 System Ready';
                }
            } catch (error) {
                document.getElementById('status').textContent = '🔴 System initializing...';
            }
        }

        init();
        setInterval(init, 30000); // Refresh status every 30 seconds
    </script>
</body>
</html>
